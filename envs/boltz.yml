# Environment for Boltz-2 structure and affinity prediction.
#
#   conda env create -f envs/boltz.yml
#   conda activate channel-design-boltz
#
# Separate from the docking environment on purpose: Boltz pulls in torch,
# which will not coexist with the numpy<2.0 pin the other stages need.
#
# torch is deliberately NOT pinned here. The correct wheel depends on the
# driver CUDA version of the machine you are on, so install it yourself:
#     pip install torch --index-url https://download.pytorch.org/whl/cu128
# On CUDA 13 / torch >= 2.12 the batch driver passes --no_kernels, which
# skips the cuequivariance-torch path (CUDA-12 wheels only).
name: channel-design-boltz
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - boltz==2.2.1
      # gemmi is NOT pinned here: boltz 2.2.1 requires gemmi==0.6.5 exactly, and
      # naming any other version makes this environment unsatisfiable. The batch
      # driver only uses gemmi for an optional mmCIF -> PDB conversion, so
      # whatever boltz pulls in is what it should use.
      - numpy
